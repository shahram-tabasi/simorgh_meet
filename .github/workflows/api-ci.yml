name: API CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: simorgh_meet
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: simorgh_meet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simorgh_meet -d simorgh_meet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://simorgh_meet:ci-password@localhost:5432/simorgh_meet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm run db:migrate --workspace @simorgh-meet/api
