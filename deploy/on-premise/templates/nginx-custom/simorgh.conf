# Simorgh Meet routes, included by the Jitsi web nginx (inside its server block).
# Upstreams are resolved at request time so nginx starts even when an optional
# profile (e.g. keycloak) is disabled.
resolver 127.0.0.11 valid=30s ipv6=off;

# Plain HTTP -> HTTPS (WebRTC needs a secure origin). Port suffix rendered by the installer.
if ($scheme = http) {
    return 301 https://$host@@HTTPS_PORT_SUFFIX@@$request_uri;
}

# Jigasi transcripts are processed by the AI worker; never serve them over HTTP.
location ^~ /transcripts/ {
    return 404;
}

location ^~ /api/ {
    set $simorgh_api http://simorgh-api:8080;
    proxy_pass $simorgh_api;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_read_timeout 3600s;
    client_max_body_size 512m;
}

location ^~ /auth/ {
    set $simorgh_kc http://simorgh-keycloak:8080;
    proxy_pass $simorgh_kc;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
}

location = / {
    rewrite ^ /simorgh/index.html last;
}

location ^~ /simorgh/ {
    alias /opt/simorgh-portal/;
    # Only the static portal assets live here.
    autoindex off;
}

location ^~ /simorgh-archive/ {
    auth_basic "Simorgh Meet archive";
    auth_basic_user_file /config/nginx-custom/archive.htpasswd;
    alias /opt/simorgh-minutes/;
    disable_symlinks on;
    autoindex on;
    add_header Cache-Control "no-store" always;

    location ~ "^/simorgh-archive/(?<room_dir>[[:alnum:]_.-]+)/(?<stamp>[0-9]{8}T[0-9]{6}Z)/(?<document>transcript\.txt|minutes\.md)$" {
        alias /opt/simorgh-minutes/$room_dir/$stamp/$document;
        types {}
        default_type "text/plain; charset=utf-8";
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "no-store" always;
        autoindex off;
    }

    location ~ ^/simorgh-archive/.*[^/]$ {
        return 404;
    }
}
